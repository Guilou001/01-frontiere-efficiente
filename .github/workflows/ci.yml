name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit tests (no external data)
        run: uv run pytest
      - name: CLI demo (synthetic data, no network)
        run: uv run efficient-frontier demo --n-sim 5000 --n-boot 20
      - name: Reproduce paired block intervals (published derived returns, no network)
        run: |
          uv run python scripts/sharpe_uncertainty.py
          git diff --exit-code -- results/tables/us/oos_sharpe_uncertainty.csv results/tables/canada/oos_sharpe_uncertainty.csv results/tables/sharpe_uncertainty_manifest.json
