[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "efficient-frontier"
version = "1.0.0"
description = "Frontière efficiente de Markowitz, simulation Monte Carlo, frontière rééchantillonnée et backtest hors échantillon sur des FNB américains et canadiens."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
# Versions épinglées sur l'environnement qui a produit results/ (uv.lock, 2026-08-23).
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "cvxpy==1.9.2",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "plotly==6.9.0",
  "yfinance==1.6.0",
  "pyarrow==25.0.1",
  "requests==2.34.2",
  "finquant==0.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4"]
rapport = [
    "gvf",
]

[project.scripts]
efficient-frontier = "efficient_frontier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/efficient_frontier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", rev = "v0.4.1" }
